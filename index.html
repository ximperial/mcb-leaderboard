<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCB Leaderboard</title>
<style>
  :root {
    color-scheme: dark;
    --accent: #1ed760;
    --accent-ink: #121212;
    --gold: #f2c94c;
    --silver: #c4c9d4;
    --bronze: #d7935a;
    --bg: #121212;
    --panel: #181818;
    --surface: #1f1f1f;
    --card: #252525;
    --border: #4d4d4d;
    --text: #ffffff;
    --text-dim: #b3b3b3;
    --shadow-card: rgba(0, 0, 0, 0.3) 0px 8px 8px;
    --shadow-elevated: rgba(0, 0, 0, 0.5) 0px 8px 24px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Helvetica Neue, Helvetica, Arial, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, "MS Gothic", sans-serif;
    max-width: 980px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    line-height: 1.4;
    background: var(--bg);
    color: var(--text);
  }
  header { margin-bottom: 2.5rem; }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 0.35rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  h1::before {
    content: "";
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }
  .updated { color: var(--text-dim); font-size: 0.75rem; }
  .category { margin-bottom: 3rem; }
  .category h2 {
    font-size: 1.13rem;
    font-weight: 600;
    margin: 0 0 1rem;
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
  }
  .category h2 .season {
    font-size: 0.66rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    background: var(--surface);
    padding: 0.2rem 0.6rem;
    border-radius: 9999px;
  }
  .tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .tab {
    background: var(--surface);
    border: none;
    color: var(--text-dim);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    font-family: inherit;
    padding: 0.5rem 1.1rem;
    border-radius: 9999px;
    cursor: pointer;
  }
  .tab.active {
    color: var(--accent-ink);
    background: var(--accent);
  }
  .tables { display: block; }
  .panel {
    display: none;
    background: var(--panel);
    border-radius: 8px;
    padding: 1rem 1.1rem 0.5rem;
    box-shadow: var(--shadow-card);
  }
  .panel.active { display: block; }
  .board { list-style: none; margin: 0; padding: 0; }
  .board .row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.25rem;
    border-bottom: 1px solid var(--surface);
    font-size: 0.88rem;
  }
  .board .row:last-child { border-bottom: none; }
  .rank {
    flex: 0 0 1.5rem;
    text-align: center;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .row.gold .rank { color: var(--gold); }
  .row.silver .rank { color: var(--silver); }
  .row.bronze .rank { color: var(--bronze); }
  .info {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .name { font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat {
    flex: 0 0 auto;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--accent);
  }
  .sub {
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .icon {
    flex: 0 0 auto;
    width: 28px; height: 28px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--surface);
    display: block;
  }
  .icon-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-dim);
  }
  .winrate {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .bar {
    width: 60px; height: 6px;
    background: var(--surface);
    border-radius: 9999px;
    overflow: hidden;
  }
  .bar .fill { display: block; height: 100%; background: var(--accent); }
  .wr-value {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 0.8rem;
    min-width: 2.4em;
    text-align: right;
  }
  .empty { color: var(--text-dim); font-style: italic; font-size: 0.8rem; padding: 0.5rem 0.25rem; }
  .pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    padding: 0.6rem 0.25rem 0.4rem;
  }
  .pager button {
    background: var(--surface);
    border: none;
    color: var(--text);
    border-radius: 50%;
    width: 1.8rem;
    height: 1.8rem;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }
  .pager button:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .pager .page-info {
    font-size: 0.72rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    min-width: 3.5em;
    text-align: center;
  }
  footer { margin-top: 3rem; color: var(--text-dim); font-size: 0.72rem; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>MCB Leaderboard</h1>
  <p class="updated">Data last changed 2026-08-25 06:45 UTC &middot; this page is rewritten only when a game finishes, so a still timestamp means no new games</p>
</header>

<footer>Generated from Aura bot match data.</footer>
<script>
(function() {
  document.querySelectorAll(".category").forEach(function(section) {
    var tabs = section.querySelectorAll(".tab");
    var panels = section.querySelectorAll(".panel");
    tabs.forEach(function(tab) {
      tab.addEventListener("click", function() {
        var target = tab.dataset.tab;
        tabs.forEach(function(t) { t.classList.toggle("active", t === tab); });
        panels.forEach(function(p) { p.classList.toggle("active", p.dataset.panel === target); });
      });
    });
  });
  document.querySelectorAll(".board[data-page-size]").forEach(function(board) {
    var pageSize = parseInt(board.dataset.pageSize, 10) || 10;
    var rows = Array.prototype.filter.call(board.children, function(li) {
      return li.classList.contains("row");
    });
    var pager = board.nextElementSibling;
    if (!pager || !pager.classList.contains("pager")) return;
    if (rows.length <= pageSize) {
      pager.style.display = "none";
      return;
    }
    var totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
    var page = 0;
    var prevBtn = pager.querySelector(".prev");
    var nextBtn = pager.querySelector(".next");
    var info = pager.querySelector(".page-info");
    function render() {
      rows.forEach(function(row, i) {
        row.style.display = (i >= page * pageSize && i < (page + 1) * pageSize) ? "" : "none";
      });
      info.textContent = (page + 1) + " / " + totalPages;
      prevBtn.disabled = page === 0;
      nextBtn.disabled = page >= totalPages - 1;
    }
    prevBtn.addEventListener("click", function() {
      if (page > 0) { page--; render(); }
    });
    nextBtn.addEventListener("click", function() {
      if (page < totalPages - 1) { page++; render(); }
    });
    render();
  });
})();
</script>
</body>
</html>
